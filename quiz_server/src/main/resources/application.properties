# ===== Application =====
spring.application.name=quiz_server
server.port=8080

# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/quiz?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowMultiQueries=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.tom.quiz.models
mybatis.configuration.map-underscore-to-camel-case=true
